<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1d1a3a" />
  <meta name="description" content="WORLD BREAKER — 세계 랜드마크를 부수는 2D 아케이드 액션 (건물 부수기 오마주)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%232f6bff%22/%3E%3Cpath d=%22M9 24V12l4-4 4 4v12M19 24V6h5v18%22 stroke=%22%23fff%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E" />
  <title>WORLD BREAKER</title>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="view" aria-label="WORLD BREAKER"></canvas>

      <header id="hud" class="hidden">
        <div class="hud-left">
          <div id="hearts" data-i18n-aria="pause"></div>
          <div class="score-box"><span class="lbl" data-i18n="score"></span><b id="score">000000000</b><span class="best"><span data-i18n="best"></span> <b id="best">0</b></span></div>
        </div>
        <div class="hud-center">
          <div id="combo" class="combo hidden"><b id="combo-n">0</b> <span data-i18n="combo"></span></div>
        </div>
        <div class="hud-right">
          <div class="where"><b id="tier">TIER 1 · EASY</b><span id="bname"></span><span class="next"><span data-i18n="next"></span>: <b id="next-name"></b></span></div>
          <button id="btn-keys" class="icon-btn" data-i18n-aria="help">?</button>
          <button id="btn-mute" class="icon-btn" data-i18n-aria="mute" aria-pressed="false">♪</button>
          <button id="btn-pause" class="icon-btn" data-i18n-aria="pause">Ⅱ</button>
        </div>
      </header>

      <div id="hint" class="hint hidden" role="status"></div>

      <footer id="status" class="hidden">
        <p id="keyguide" class="control-hints"></p>
        <div class="gauge special" id="special-wrap"><span class="g-lbl">SPECIAL</span><div class="g-track"><div id="special-fill"></div></div><span id="special-pct">0%</span><span id="special-ready" class="ready hidden">SPECIAL READY</span></div>
      </footer>

      <!-- every app state lives on this one page -->
      <!-- v5: the world map is the first screen -->
      <section id="ov-map" class="overlay map hidden" aria-label="World map"></section>

      <section id="ov-clear" class="overlay hidden">
        <div class="panel center result">
          <h2 id="clear-title"></h2>
          <p id="clear-stars" class="stars-big"></p>
          <dl class="tally">
            <dt data-i18n="score"></dt><dd id="clear-score">0</dd>
            <dt data-i18n="maxCombo"></dt><dd id="clear-combo">0</dd>
            <dt data-i18n="livesLeft"></dt><dd id="clear-lives"></dd>
          </dl>
          <p id="clear-unlock" class="unlock hidden"></p>
          <p id="clear-world" class="world-complete hidden"><b data-i18n="worldComplete"></b><br><span data-i18n="worldCompleteSub"></span></p>
          <p id="clear-save" class="save-warn hidden" data-i18n="saveFailed"></p>
          <button id="btn-next" class="big-btn" data-i18n="nextLevel"></button>
          <div class="row">
            <button id="btn-clear-retry" class="small-btn" data-i18n="retry"></button>
            <button id="btn-clear-map" class="small-btn" data-i18n="worldMapBtn"></button>
          </div>
        </div>
      </section>

      <section id="ov-fail" class="overlay hidden">
        <div class="panel center result">
          <h2 id="fail-title"></h2>
          <p id="fail-progress" class="fail-progress"></p>
          <dl class="tally">
            <dt data-i18n="score"></dt><dd id="fail-score">0</dd>
            <dt data-i18n="maxCombo"></dt><dd id="fail-combo">0</dd>
          </dl>
          <button id="btn-fail-retry" class="big-btn" data-i18n="retry"></button>
          <button id="btn-fail-map" class="small-btn" data-i18n="worldMapBtn"></button>
        </div>
      </section>

      <section id="ov-title" class="overlay">
        <div class="title-card">
          <h1 class="logo"><span>WORLD</span><span>BREAKER</span></h1>
          <p class="subtitle" data-i18n="subtitle"></p>
          <p class="records"><span data-i18n="best"></span> <b id="title-best">0</b> · <span data-i18n="bestCombo"></span> <b id="title-combo">0</b> · <b id="title-stars">★ 0 / 30</b></p>
          <button id="btn-start" class="big-btn" data-i18n="start"></button>
          <div class="row">
            <button id="btn-help" class="small-btn" data-i18n="help"></button>
            <button id="btn-sound" class="small-btn sound-toggle"></button>
            <label class="lang"><span class="sr" data-i18n="language"></span><select class="lang-select small-btn"></select></label>
          </div>
          <p class="keys-line" data-i18n="keyGuide"></p>
        </div>
      </section>

      <section id="ov-help" class="overlay hidden">
        <div class="panel">
          <h2 data-i18n="helpTitle"></h2>
          <table class="keys">
            <tr><th data-i18n="move"></th><td><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd></td></tr>
            <tr><th data-i18n="jump"></th><td><kbd>↑</kbd> / <kbd>W</kbd> / <kbd>Space</kbd></td></tr>
            <tr><th data-i18n="guard"></th><td><kbd>↓</kbd> / <kbd>S</kbd></td></tr>
            <tr><th data-i18n="attack"></th><td><kbd>Z</kbd> / <kbd>J</kbd></td></tr>
            <tr><th data-i18n="special"></th><td><kbd>X</kbd> / <kbd>K</kbd></td></tr>
            <tr><th data-i18n="pause"></th><td><kbd>Esc</kbd> / <kbd>P</kbd> · <span data-i18n="mute"></span> <kbd>M</kbd></td></tr>
          </table>
          <ul class="rules">
            <li data-i18n-html="rule1"></li>
            <li data-i18n-html="rule2"></li>
            <li data-i18n-html="rule3"></li>
            <li data-i18n-html="rule4"></li>
          </ul>
          <label class="check"><input type="checkbox" id="opt-tutorial" /> <span data-i18n="showTutorial"></span></label>
          <label class="check"><input type="checkbox" id="opt-hp" /> <span data-i18n="showHp"></span></label>
          <label class="check"><input type="checkbox" id="opt-fx" /> <span data-i18n="effectsLow"></span></label>
          <button id="btn-reset-story" class="small-btn danger" data-i18n="resetProgress"></button>
          <button class="big-btn" data-close="ov-help" data-i18n="ok"></button>
        </div>
      </section>

      <section id="ov-pause" class="overlay hidden">
        <div class="panel center">
          <h2 data-i18n="paused"></h2>
          <p id="pause-keys" class="control-hints pause-keys"></p>
          <button id="btn-resume" class="big-btn" data-i18n="resume"></button>
          <div class="row">
            <button id="btn-pause-sound" class="small-btn sound-toggle"></button>
            <label class="lang"><span class="sr" data-i18n="language"></span><select class="lang-select small-btn"></select></label>
            <button id="btn-quit" class="small-btn" data-i18n="quit"></button>
          </div>
          <div class="row story-only">
            <button id="btn-pause-retry" class="small-btn" data-i18n="retry"></button>
            <button id="btn-pause-map" class="small-btn" data-i18n="worldMapBtn"></button>
          </div>
        </div>
      </section>

      <section id="ov-over" class="overlay hidden">
        <div class="panel center">
          <h2 data-i18n="gameOver"></h2>
          <p id="over-record" class="record hidden" data-i18n="newRecord"></p>
          <dl class="tally">
            <dt data-i18n="score"></dt><dd id="over-score">0</dd>
            <dt data-i18n="destroyed"></dt><dd id="over-destroyed">0</dd>
            <dt data-i18n="maxCombo"></dt><dd id="over-combo">0</dd>
            <dt data-i18n="best"></dt><dd id="over-best">0</dd>
          </dl>
          <button id="btn-restart" class="big-btn" data-i18n="restart"></button>
          <button id="btn-home" class="small-btn" data-i18n="quit"></button>
        </div>
      </section>
    </div>

    <!-- touch devices only: six buttons, all usable at once -->
    <nav id="pad" aria-hidden="true">
      <div class="pad-group">
        <button class="pb" id="pb-left">◀</button>
        <button class="pb" id="pb-right">▶</button>
      </div>
      <div class="pad-group">
        <button class="pb" id="pb-jump">▲</button>
        <button class="pb" id="pb-guard">▼</button>
      </div>
      <div class="pad-group">
        <button class="pb pb-attack" id="pb-attack" data-i18n="attack"></button>
        <button class="pb pb-special" id="pb-special" disabled>X</button>
      </div>
    </nav>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
